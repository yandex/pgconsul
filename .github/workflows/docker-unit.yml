name: Unit tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  workflow_call:

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            tox.ini
      - name: Install tox
        run: pip install tox

      - name: Run unit tests
        run: make unit_test
