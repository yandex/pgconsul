name: Full suite on PR

on:
  push:
    branches:
      - main
      - stable
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - stable

jobs:
  mypy:
    uses: ./.github/workflows/docker-mypy.yml

  unit:
    uses: ./.github/workflows/docker-unit.yml

  behave:
    name: behave
    needs: [mypy, unit]
    if: ${{ success() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    uses: ./.github/workflows/docker-behave.yml

  faultstorm:
    name: faultstorm
    needs: [mypy, unit]
    if: ${{ success() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    uses: ./.github/workflows/docker-faultstorm.yml

  jepsen:
    name: jepsen
    needs: [mypy, unit]
    if: ${{ success() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    uses: ./.github/workflows/docker-jepsen.yml
