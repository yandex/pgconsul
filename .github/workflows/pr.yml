name: Full suite on PR

on:
  push:
    branches:
      - main
      - stable
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - stable

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mypy:
    uses: ./.github/workflows/docker-mypy.yml

  unit:
    uses: ./.github/workflows/docker-unit.yml

  behave:
    name: behave
    needs: [mypy, unit]
    if: ${{ success() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.number != 296)) }}
    uses: ./.github/workflows/docker-behave.yml

  faultstorm:
    name: faultstorm
    needs: [mypy, unit, behave]
    if: >-
      ${{ always() &&
          needs.mypy.result == 'success' && needs.unit.result == 'success' &&
          (needs.behave.result == 'success' ||
           (github.event_name == 'pull_request' && github.event.pull_request.number == 296 && needs.behave.result == 'skipped')) &&
          (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    uses: ./.github/workflows/docker-faultstorm.yml

  jepsen:
    name: jepsen
    needs: [mypy, unit, behave]
    if: >-
      ${{ always() &&
          needs.mypy.result == 'success' && needs.unit.result == 'success' &&
          (needs.behave.result == 'success' ||
           (github.event_name == 'pull_request' && github.event.pull_request.number == 296 && needs.behave.result == 'skipped')) &&
          (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    uses: ./.github/workflows/docker-jepsen.yml
