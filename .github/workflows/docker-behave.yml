name: Behave tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  workflow_call:

jobs:
  build:
    name: build images
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: make build_behave

      - name: Save images
        run: make save_ci_images

      - name: Upload images
        uses: actions/upload-artifact@v7
        with:
          name: pgconsul-ci-images
          path: pgconsul-ci-images.tar
          retention-days: 1

  test:
    name: behave
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        feature:
          - "anywhere_switchover"
          - "archive"
          - "async"
          - "autofailover"
          - "cascade"
          - "consecutive_switch"
          - "coordinator_fail"
          - "coordinator"
          - "dead_primary_switchover"
          - "disable_sync"
          - "failed_promote"
          - "failover_timeout"
          - "failover_with_network_inconsistency"
          - "initialization"
          - "kill_non_ha_replica"
          - "kill_primary"
          - "kill_replica"
          - "maintenance"
          - "maintenance_db_unavailable"
          - "op_track"
          - "pgconsul_util"
          - "primary_switch"
          - "priority"
          - "quorum_removal_delay"
          - "reset_sync"
          - "single_node"
          - "slot"
          - "ssn_before_promote"
          - "start"
          - "targeted_switchover"
          - "wal_upload_after_promote"
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Download images
        uses: actions/download-artifact@v7
        with:
          name: pgconsul-ci-images

      - name: Load images
        run: make load_ci_images

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install tox
        run: pip install tox

      - name: Test
        run: "TEST_ARGS='-i ${{ matrix.feature }}.feature' make check_test_only"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs-${{ matrix.feature }}
          path: logs
