name: Faultstorm tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  workflow_call:

jobs:
  test:
    name: faultstorm
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Test
        env:
          SKIP_BEHAVE: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 296 }}
        run: |
          if [ "$SKIP_BEHAVE" = "true" ]; then
            make faultstorm_build faultstorm_up faultstorm_test faultstorm_cleanup
          else
            make faultstorm
          fi

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs
          path: logs
